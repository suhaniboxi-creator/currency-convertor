<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Convertor</title>
    <link href ="style.css" rel ="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div>
        <button class="mode-button dark-mode"><i class="fa-regular fa-moon"></i><p>Light Mode</p></button>
    </div>
    <div class="container">
        <h1> Currency Convertor</h1>
        <form>
            <div  class="amount" >
                <p>Enter Amount</p>
                <input value="100" placeholder ="Enter Amount" type ="text" class ="input"/>
                </div>
                <div class="dropdown">
                    <div class="from">
                        <p>Convert From</p>
                        <div class="select-container">
                            <img id ="fromFlag" src="https://flagsapi.com/US/shiny/64.png">
                            <select name ="from">
                                <option value="USD">USD</option>
                                
                            </select>
                        </div>
                    </div>
                    <div class="convertImg">
                        <i class="fa-solid fa-arrow-right-arrow-left"></i>
                    </div>
                     
                    <div class="to">
                    <p>Convert To</p>
                        <div class="select-container">
                            <img id="toFlag" src="https://flagsapi.com/IN/shiny/64.png">
                            <select name ="to">
                                <option value="INR">INR</option>

                            </select>
                        </div>
                        </div>
         </form>
    </div>
    <div class ="copyMsg hide"> Copied!</div>
    <div class="errorMsg hide">
            <p>Enter valid amount!</p>
             </div>
    <div class="exchangeRate">
        <div class ="msg"> 1USD=95INR </div>
        <div class="copyBtn"><button>Copy <i class="fa-regular fa-copy"></i></button> </div>
        <button class="exchangeRate-btn"> Get Exchange Rate</button>
    </div>

    <br>
    <div id="historyMsg"><p>Your Past Conversions</p></div>
    <div id="history"></div>
   <script src="codes.js"></script>
<script src="app.js"></script>
</body>
</html>
